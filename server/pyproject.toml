[project]
name = "jejak-server"
version = "0.1.0"
description = "Jejak server: the knowledge graph, its users, spaces and roles, over HTTP and MCP"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.20",
    "argon2-cffi>=23.1",
    "mcp>=1.9,<2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false
