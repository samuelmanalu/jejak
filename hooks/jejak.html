<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jejak Observatory</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-elevated: #161b22;
    --bg-surface: #1c2128;
    --border: #30363d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --search-bg: #0d1117;
    --search-border: #30363d;
    --shadow: rgba(0,0,0,0.4);
    --stat-bg: rgba(22,27,34,0.85);
    --filter-bg: rgba(22,27,34,0.92);
    --scrollbar-thumb: #30363d;
    --scrollbar-track: transparent;
    --c-decision: #58a6ff;
    --c-learning: #d2a8ff;
    --c-solution: #56d364;
    --c-finding: #e3b341;
    --c-architecture: #f97583;
    --c-convention: #79c0ff;
    --c-context: #b392f0;
    --c-issue: #f85149;
    --c-prompt: #484f58;
    --edge-color: rgba(48, 54, 61, 0.5);
    --edge-highlight: rgba(88, 166, 255, 0.6);
    --node-glow: 0.25;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --bg-elevated: #f6f8fa;
      --bg-surface: #eef1f5;
      --border: #d0d7de;
      --text-primary: #1f2328;
      --text-secondary: #656d76;
      --text-muted: #8b949e;
      --search-bg: #ffffff;
      --search-border: #d0d7de;
      --shadow: rgba(31,35,40,0.12);
      --stat-bg: rgba(246,248,250,0.92);
      --filter-bg: rgba(246,248,250,0.95);
      --scrollbar-thumb: #d0d7de;
      --c-decision: #0969da;
      --c-learning: #8250df;
      --c-solution: #1a7f37;
      --c-finding: #9a6700;
      --c-architecture: #cf222e;
      --c-convention: #0550ae;
      --c-context: #6639ba;
      --c-issue: #d1242f;
      --c-prompt: #8b949e;
      --edge-color: rgba(208, 215, 222, 0.7);
      --edge-highlight: rgba(9, 105, 218, 0.5);
      --node-glow: 0.15;
    }
  }

  :root[data-theme="light"] {
    --bg: #ffffff;
    --bg-elevated: #f6f8fa;
    --bg-surface: #eef1f5;
    --border: #d0d7de;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --text-muted: #8b949e;
    --search-bg: #ffffff;
    --search-border: #d0d7de;
    --shadow: rgba(31,35,40,0.12);
    --stat-bg: rgba(246,248,250,0.92);
    --filter-bg: rgba(246,248,250,0.95);
    --scrollbar-thumb: #d0d7de;
    --c-decision: #0969da;
    --c-learning: #8250df;
    --c-solution: #1a7f37;
    --c-finding: #9a6700;
    --c-architecture: #cf222e;
    --c-convention: #0550ae;
    --c-context: #6639ba;
    --c-issue: #d1242f;
    --c-prompt: #8b949e;
    --edge-color: rgba(208, 215, 222, 0.7);
    --edge-highlight: rgba(9, 105, 218, 0.5);
    --node-glow: 0.15;
  }

  :root[data-theme="dark"] {
    --bg: #0d1117;
    --bg-elevated: #161b22;
    --bg-surface: #1c2128;
    --border: #30363d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --search-bg: #0d1117;
    --search-border: #30363d;
    --shadow: rgba(0,0,0,0.4);
    --stat-bg: rgba(22,27,34,0.85);
    --filter-bg: rgba(22,27,34,0.92);
    --scrollbar-thumb: #30363d;
    --c-decision: #58a6ff;
    --c-learning: #d2a8ff;
    --c-solution: #56d364;
    --c-finding: #e3b341;
    --c-architecture: #f97583;
    --c-convention: #79c0ff;
    --c-context: #b392f0;
    --c-issue: #f85149;
    --c-prompt: #484f58;
    --edge-color: rgba(48, 54, 61, 0.5);
    --edge-highlight: rgba(88, 166, 255, 0.6);
    --node-glow: 0.25;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    position: relative;
  }

  #graph-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;  /* pan and pinch are handled by the page, not the browser */
  }
  #graph-canvas.grabbing { cursor: grabbing; }
  #graph-canvas.pointer { cursor: pointer; }

  /* ---------- Top bar ---------- */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--stat-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 20;
    flex-wrap: wrap;
  }

  .top-bar .logo {
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .top-bar .logo span {
    color: var(--c-decision);
  }

  .search-wrap {
    position: relative;
    flex: 0 1 260px;
    min-width: 140px;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    fill: none;
    stroke: var(--text-muted);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .search-wrap input {
    width: 100%;
    padding: 6px 10px 6px 32px;
    background: var(--search-bg);
    border: 1px solid var(--search-border);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input::placeholder { color: var(--text-muted); }
  .search-wrap input:focus { border-color: var(--c-decision); }

  .stats {
    display: flex;
    gap: 16px;
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
    font-size: 12px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    margin-left: auto;
  }
  .stats .stat-val {
    color: var(--text-primary);
    font-weight: 600;
  }

  /* ---------- Filter panel ---------- */
  .filter-panel {
    position: absolute;
    top: 52px;
    left: 12px;
    background: var(--filter-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 170px;
    max-width: 220px;   /* long project names would otherwise widen the dropdown */
    box-shadow: 0 4px 16px var(--shadow);
  }
  .filter-panel .filter-heading {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .filter-panel label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    padding: 2px 0;
  }
  .filter-panel label:hover { color: var(--text-primary); }
  .filter-panel input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1.5px solid var(--border);
    background: transparent;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
  }
  .filter-panel input[type="checkbox"]:checked {
    border-color: transparent;
  }
  .filter-panel input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    inset: 2px;
    border-radius: 1.5px;
  }
  .filter-panel .type-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .filter-panel select {
    margin-top: 4px;
    padding: 5px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-primary);
    font-size: 12px;
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
    outline: none;
    cursor: pointer;
  }
  .filter-panel select { width: 100%; max-width: 100%; text-overflow: ellipsis; }
  .filter-panel select:focus { border-color: var(--c-decision); }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 340px;
    max-width: 90vw;
    background: var(--bg-elevated);
    border-left: 1px solid var(--border);
    z-index: 25;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    overflow: hidden;
  }
  .sidebar.open { transform: translateX(0); }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sidebar-header .node-type-badge {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
  }
  .sidebar-header .close-btn {
    width: 28px; height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 4px;
    font-size: 18px;
    line-height: 1;
  }
  .sidebar-header .close-btn:hover {
    background: var(--bg-surface);
    color: var(--text-primary);
  }

  /* Filters button: only on small screens, where the panel starts closed. */
  .filter-toggle {
    display: none;
    padding: 6px 10px;
    background: var(--search-bg);
    border: 1px solid var(--search-border);
    border-radius: 6px;
    color: var(--text-secondary);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .relayout-btn {
    margin-top: 8px;
    padding: 6px 8px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .relayout-btn + .relayout-btn { margin-top: 4px; }
  .relayout-btn:hover { color: var(--text-primary); }

  /* ---------- Phones ---------- */
  @media (max-width: 640px) {
    .top-bar {
      padding: 8px 10px;
      padding-top: max(8px, env(safe-area-inset-top));
      gap: 8px;
    }
    .search-wrap { flex: 1 1 auto; min-width: 0; }
    .search-wrap input { font-size: 16px; }  /* iOS zooms into inputs under 16px */
    .filter-toggle { display: block; }
    .stats {
      width: 100%;
      margin-left: 0;
      gap: 12px;
      font-size: 11px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .filter-panel {
      display: none;
      top: calc(92px + env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      max-width: none;
      max-height: calc(100dvh - 120px);
      overflow-y: auto;
    }
    .filter-panel.open { display: flex; }
    .filter-panel label { padding: 6px 0; font-size: 14px; }
    .filter-panel input[type="checkbox"] { width: 18px; height: 18px; }
    .filter-panel select { font-size: 16px; padding: 6px; }
    /* The details panel becomes a bottom sheet over the lower part of the map. */
    .sidebar {
      top: auto;
      left: 0;
      width: 100%;
      max-width: 100%;
      height: 60dvh;
      border-left: none;
      border-top: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      transform: translateY(100%);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sidebar.open { transform: translateY(0); }
    .sidebar-header .close-btn { width: 40px; height: 40px; font-size: 24px; }
    .tooltip { display: none; }
  }

  .sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .sidebar-body::-webkit-scrollbar { width: 6px; }
  .sidebar-body::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  .sidebar-body::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

  .detail-section .detail-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .detail-section .detail-id {
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .detail-section .detail-content {
    font-size: 14px;
    line-height: 1.55;
    color: var(--text-primary);
  }
  .detail-section .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .detail-section .tag {
    font-size: 11px;
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .detail-section .connection-item {
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 4px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    margin-bottom: 4px;
    cursor: pointer;
    transition: border-color 0.12s;
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .detail-section .connection-item:hover {
    border-color: var(--c-decision);
    color: var(--text-primary);
  }
  .connection-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ---------- Tooltip ---------- */
  .tooltip {
    position: absolute;
    pointer-events: none;
    padding: 5px 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 12px;
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
    color: var(--text-primary);
    z-index: 30;
    white-space: nowrap;
    box-shadow: 0 4px 12px var(--shadow);
    opacity: 0;
    transition: opacity 0.1s;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .tt-type {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-left: 6px;
  }

  /* ---------- Empty sidebar ---------- */
  .sidebar-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: var(--text-muted);
    font-size: 13px;
    gap: 6px;
  }
  .sidebar-empty svg {
    width: 32px; height: 32px;
    stroke: var(--text-muted);
    fill: none;
    stroke-width: 1.5;
    opacity: 0.5;
  }
  /* ===== Account and login (served by a Jejak server) ===== */
  .account { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
  .account select, .account button { background: var(--search-bg); border: 1px solid var(--search-border);
    border-radius: 6px; color: var(--text-secondary); font: inherit; font-size: 12px; padding: 4px 6px; cursor: pointer; }
  .login { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 8, 15, 0.85); padding: 16px; }
  .login[hidden] { display: none; }
  .login form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px;
    background: var(--sidebar-bg, #0f1420); border: 1px solid var(--search-border); border-radius: 10px; padding: 20px; }
  .login h2 { margin: 0 0 4px; font-size: 16px; color: var(--text-primary, #e6e6e6); }
  .login input { background: var(--search-bg); border: 1px solid var(--search-border); border-radius: 6px;
    color: var(--text-primary, #e6e6e6); font: inherit; font-size: 16px; padding: 9px 10px; }
  .login button { background: #3b82f6; border: 0; border-radius: 6px; color: #fff; font: inherit; font-size: 15px;
    padding: 10px; cursor: pointer; }
  .login .note { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
  .login .err { font-size: 13px; color: #f87171; min-height: 1em; }
  @media (max-width: 640px) { .account .who { display: none; } }
</style>

<canvas id="graph-canvas"></canvas>

<div class="top-bar">
  <div class="logo"><span>//</span> jejak</div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    <input type="text" id="search-input" placeholder="Search nodes..." spellcheck="false" />
  </div>
  <button class="filter-toggle" id="filter-toggle" aria-controls="filter-panel" aria-expanded="false">Filters</button>
  <div class="stats" id="stats-bar"></div>
  <div class="account" id="account" hidden></div>
</div>

<div class="login" id="login" hidden>
  <form id="login-form" autocomplete="on">
    <h2>Sign in to Jejak</h2>
    <input id="login-user" name="username" autocomplete="username" placeholder="Username" required>
    <input id="login-pass" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
    <div class="err" id="login-err" role="alert"></div>
    <button type="submit">Sign in</button>
    <div class="note">No password yet? Set one in a terminal with <code>jejak password</code>.</div>
  </form>
</div>

<div class="filter-panel" id="filter-panel"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="node-type-badge" id="sidebar-badge"></span>
    <button class="close-btn" id="sidebar-close" aria-label="Close">&times;</button>
  </div>
  <div class="sidebar-body" id="sidebar-body"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function () {
  "use strict";

  // ===== DATA (loaded live from /data.json — no static snapshot) =====
  let NODES = [];
  let EDGES = [];

  // ===== COLOR MAP =====
  const TYPE_COLORS_DARK = {
    decision: '#58a6ff', learning: '#d2a8ff', solution: '#56d364',
    finding: '#e3b341', architecture: '#f97583', convention: '#79c0ff',
    context: '#b392f0', issue: '#f85149', prompt: '#484f58'
  };

  function getTypeColor(type) {
    const cs = getComputedStyle(document.documentElement);
    return cs.getPropertyValue('--c-' + type).trim() || TYPE_COLORS_DARK[type] || '#484f58';
  }

  // ===== INDEX DATA =====
  let nodeMap = new Map();
  let allTypes = [];
  let allProjects = [];
  let allTopics = [];

  function rebuildIndices() {
    nodeMap = new Map();
    NODES.forEach(n => {
      n.topics = n.topics || [];
      n.projects = (n.projects || []).filter(Boolean);
      n.sessions = n.sessions || [];
      n.x = 0; n.y = 0; n.vx = 0; n.vy = 0; n.connections = 0;
      nodeMap.set(n.id, n);
    });
    EDGES.forEach(e => {
      const s = nodeMap.get(e.source);
      const t = nodeMap.get(e.target);
      if (s) s.connections++;
      if (t) t.connections++;
    });
    allTypes = [...new Set(NODES.map(n => n.type))].sort();
    allProjects = [...new Set(NODES.flatMap(n => n.projects))].sort();
    allTopics = [...new Set(NODES.flatMap(n => n.topics))].sort();
  }
  rebuildIndices();

  // ===== STATE =====
  let visibleTypes = new Set(allTypes);
  let filterProject = '';
  let searchQuery = '';
  let selectedNodeId = null;
  let hoveredNode = null;

  // Camera
  let camX = 0, camY = 0, camZoom = 1;
  const MIN_ZOOM = 0.03, MAX_ZOOM = 5;
  let cameraTouched = false;   // once the user pans or zooms, stop auto-fitting

  // Frame the visible bubbles, below the top bar, on any screen size.
  function fitView() {
    const vis = getVisibleNodes();
    if (!vis.length) return;
    // Frame the dense core, not the sparse halo of weakly linked bubbles around
    // it (up to half of them), which would shrink the core to a dot. Centre on
    // the inner half of the bubbles and size the frame to hold them, plus margin.
    const med = arr => arr.slice().sort((a, b) => a - b)[arr.length >> 1];
    let cx = med(vis.map(n => n.x)), cy = med(vis.map(n => n.y));
    const inner = r => vis.filter(n => Math.hypot(n.x - cx, n.y - cy) <= r);
    let ds = vis.map(n => Math.hypot(n.x - cx, n.y - cy)).sort((a, b) => a - b);
    const core = inner(ds[ds.length >> 1]);
    cx = core.reduce((a, n) => a + n.x, 0) / core.length;
    cy = core.reduce((a, n) => a + n.y, 0) / core.length;
    ds = vis.map(n => Math.hypot(n.x - cx, n.y - cy)).sort((a, b) => a - b);
    const radius = Math.max(50, 1.15 * ds[ds.length >> 1]);
    const top = document.querySelector('.top-bar').offsetHeight;
    const w = window.innerWidth - 24, h = window.innerHeight - top - 24;
    camZoom = Math.max(MIN_ZOOM, Math.min(1.5, Math.min(w, h) / (2 * radius)));
    camX = cx;
    camY = cy - top / 2 / camZoom;   // centre in the area under the bar
  }

  let isDragging = false, dragStartX = 0, dragStartY = 0, camStartX = 0, camStartY = 0;
  let draggedNode = null;

  // ===== DOM REFS =====
  const canvas = document.getElementById('graph-canvas');
  const ctx = canvas.getContext('2d');
  const statsBar = document.getElementById('stats-bar');
  const filterPanel = document.getElementById('filter-panel');
  const sidebar = document.getElementById('sidebar');
  const sidebarBadge = document.getElementById('sidebar-badge');
  const sidebarBody = document.getElementById('sidebar-body');
  const sidebarClose = document.getElementById('sidebar-close');
  const searchInput = document.getElementById('search-input');
  const tooltip = document.getElementById('tooltip');

  // ===== STATS =====
  function updateStats() {
    const vis = getVisibleNodes();
    const visEdges = getVisibleEdges();
    const projects = new Set(vis.flatMap(n => n.projects));
    const topics = new Set(vis.flatMap(n => n.topics));
    const publicCount = vis.filter(n => n.public).length;
    statsBar.innerHTML =
      `<span><span class="stat-val">${vis.length}</span> nodes</span>` +
      `<span><span class="stat-val">${visEdges.length}</span> edges</span>` +
      `<span><span class="stat-val">${projects.size}</span> projects</span>` +
      `<span><span class="stat-val">${topics.size}</span> topics</span>` +
      `<span><span class="stat-val">${publicCount}</span> public</span>`;
  }

  // ===== FILTERS =====
  function buildFilters() {
    let html = '<div class="filter-heading">Memory Type</div>';
    allTypes.forEach(t => {
      const col = getTypeColor(t);
      const checked = visibleTypes.has(t) ? 'checked' : '';
      html += `<label>
        <input type="checkbox" data-type="${t}" ${checked} style="border-color:${col}"/>
        <span class="type-dot" style="background:${col}"></span>
        ${t}
      </label>`;
    });
    html += '<div class="filter-heading" style="margin-top:8px">Project</div>';
    html += '<select id="project-filter"><option value="">All projects</option>';
    allProjects.forEach(p => {
      const sel = (p === filterProject) ? 'selected' : '';
      html += `<option value="${p}" ${sel}>${p}</option>`;
    });
    html += '</select>';
    html += '<button class="relayout-btn" id="fit-btn" title="Shortcut: F">Fit map to screen</button>';
    html += '<button class="relayout-btn" id="relayout-btn" title="Shortcut: L">Lay out the map again</button>';
    filterPanel.innerHTML = html;
    document.getElementById('relayout-btn').addEventListener('click', relayout);
    document.getElementById('fit-btn').addEventListener('click', () => {
      fitView();
      filterPanel.classList.remove('open');
    });

    filterPanel.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      const t = cb.dataset.type;
      const col = getTypeColor(t);
      cb.style.setProperty('--cb-color', col);
      cb.addEventListener('change', () => {
        if (cb.checked) visibleTypes.add(t); else visibleTypes.delete(t);
        updateStats();
      });
    });

    // Style checked checkboxes (single reusable <style>, no leak on refresh)
    let style = document.getElementById('type-check-styles');
    if (!style) {
      style = document.createElement('style');
      style.id = 'type-check-styles';
      document.head.appendChild(style);
    }
    let css = '';
    allTypes.forEach(t => {
      const col = getTypeColor(t);
      css += `input[data-type="${t}"]:checked { background: ${col}; }\n`;
      css += `input[data-type="${t}"]:checked::after { background: ${col}; }\n`;
    });
    style.textContent = css;

    document.getElementById('project-filter').addEventListener('change', e => {
      filterProject = e.target.value;
      updateStats();
    });
  }

  function getVisibleNodes() {
    return NODES.filter(n => {
      if (!visibleTypes.has(n.type)) return false;
      if (filterProject && !n.projects.includes(filterProject)) return false;
      return true;
    });
  }

  function getVisibleEdges() {
    const vis = new Set(getVisibleNodes().map(n => n.id));
    return EDGES.filter(e => vis.has(e.source) && vis.has(e.target));
  }

  function isHighlighted(n) {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return n.id.includes(q) || n.content.toLowerCase().includes(q) ||
           n.type.includes(q) || n.topics.some(t => t.includes(q)) ||
           n.projects.some(p => p.includes(q));
  }

  // ===== SIZING =====
  function nodeRadius(n) {
    // sqrt keeps sizes distinguishable: with linear growth nearly every linked
    // memory hit the cap, and thousands of max-size bubbles stacked up.
    const base = n.type === 'prompt' ? 4 : 5;
    return base + Math.min(Math.sqrt(n.connections) * 1.6, MAX_RADIUS - 5);
  }

  // ===== INIT POSITIONS =====
  function initPositions() {
    NODES.forEach(n => {
      const angle = Math.random() * Math.PI * 2;
      const r = 100 + Math.random() * 200;
      n.x = Math.cos(angle) * r;
      n.y = Math.sin(angle) * r;
      n.vx = 0; n.vy = 0;
    });
  }

  // ===== PHYSICS =====
  const REPULSION = 1500;
  const SPRING_K = 0.1;       // per link, divided by degree below
  const SPRING_REST = 80;
  const CENTER_GRAVITY = 0.003;
  const MAX_STEP = 40;
  const MAX_RADIUS = 13;        // largest bubble nodeRadius() can return
  const COLLIDE_PAD = 2;        // gap kept between bubbles
  const COLLIDE_STRENGTH = 0.7;
  const COLLIDE_PASSES = 3;
  const DAMPING = 0.6;         // d3-force default velocity decay
  const DT = 1;

  // ===== COOLING: the layout settles once, then stays still =====
  // `alpha` is the layout's temperature. It decays every frame and the physics
  // stops below ALPHA_MIN, so bubbles come to rest instead of drifting forever.
  // `movable` limits which nodes may move: null = all (a full layout), a Set =
  // only those ids (newly arrived knowledge), so the rest of the map stays put.
  const ALPHA_DECAY = 0.95;
  const ALPHA_MIN = 0.005;
  const LAYOUT_KEY = 'jejak-layout-v2';   // v1 layouts could be exploded; ignore them
  const LAYOUT_LIMIT = 1e6;               // a saved layout wider than this is broken
  let alpha = 0;              // the first data load decides what moves
  let movable = new Set();

  function canMove(n) {
    return n !== draggedNode && (movable === null || movable.has(n.id));
  }

  function loadLayout() {
    try {
      localStorage.removeItem('jejak-layout-v1');
      const pos = JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}');
      const sane = Object.values(pos).every(p => Array.isArray(p) &&
        Math.abs(p[0]) < LAYOUT_LIMIT && Math.abs(p[1]) < LAYOUT_LIMIT);
      return sane ? pos : {};
    } catch (_) { return {}; }
  }

  function saveLayout() {
    try {
      const pos = {};
      NODES.forEach(n => { pos[n.id] = [Math.round(n.x), Math.round(n.y)]; });
      localStorage.setItem(LAYOUT_KEY, JSON.stringify(pos));
    } catch (_) { /* private window or full storage: the layout just isn't remembered */ }
  }

  function settle() {
    alpha = 0;
    movable = new Set();
    NODES.forEach(n => { n.vx = 0; n.vy = 0; });
    saveLayout();
    if (!cameraTouched) fitView();
  }

  function relayout() {
    movable = null;
    alpha = 1;
    kickLayout();
  }

  // ===== Barnes-Hut repulsion =====
  // Pairwise repulsion is O(n^2): with thousands of memories one frame took
  // seconds and froze the tab. A quadtree lets a distant cluster push as one
  // body, O(n log n).
  const THETA2 = 0.81;      // theta 0.9: a cell this small relative to its distance counts as one body
  const MAX_DEPTH = 24;     // coincident points share a leaf instead of splitting forever

  function bhCell(x0, y0, size) {
    return { x0, y0, size, pts: [], kids: null, mass: 0, cx: 0, cy: 0 };
  }

  function bhInsert(cell, n, depth) {
    while (true) {
      if (!cell.kids) {
        if (cell.pts.length === 0 || depth >= MAX_DEPTH) { cell.pts.push(n); return; }
        const h = cell.size / 2;
        cell.kids = [bhCell(cell.x0, cell.y0, h), bhCell(cell.x0 + h, cell.y0, h),
                     bhCell(cell.x0, cell.y0 + h, h), bhCell(cell.x0 + h, cell.y0 + h, h)];
        const old = cell.pts; cell.pts = [];
        old.forEach(p => bhInsert(cell, p, depth));
      }
      const h = cell.size / 2;
      cell = cell.kids[(n.x >= cell.x0 + h ? 1 : 0) + (n.y >= cell.y0 + h ? 2 : 0)];
      depth++;
    }
  }

  function bhMass(cell) {
    const pts = cell.pts, kids = cell.kids;
    let m = 0, cx = 0, cy = 0;
    if (!kids) {
      for (let i = 0; i < pts.length; i++) { cx += pts[i].x; cy += pts[i].y; }
      m = pts.length;
    } else {
      for (let i = 0; i < 4; i++) {
        const k = kids[i];
        bhMass(k);
        m += k.mass; cx += k.cx * k.mass; cy += k.cy * k.mass;
      }
    }
    cell.mass = m;
    if (m) { cell.cx = cx / m; cell.cy = cy / m; }
  }

  // Hot path: plain loops and an explicit stack (no closures, no recursion).
  const bhStack = [];
  function bhRepel(n, root) {
    const nx = n.x, ny = n.y;
    let fx = 0, fy = 0;
    bhStack.length = 0;
    bhStack.push(root);
    while (bhStack.length) {
      const cell = bhStack.pop();
      if (!cell.mass) continue;
      if (!cell.kids) {
        const pts = cell.pts;
        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          if (p === n) continue;
          const dx = p.x - nx, dy = p.y - ny;
          let d2 = dx * dx + dy * dy;
          if (d2 < 1) d2 = 1;
          const f = REPULSION / (d2 * Math.sqrt(d2));
          fx -= dx * f; fy -= dy * f;
        }
        continue;
      }
      const dx = cell.cx - nx, dy = cell.cy - ny;
      let d2 = dx * dx + dy * dy;
      if (d2 > 0 && cell.size * cell.size < THETA2 * d2) {
        if (d2 < 1) d2 = 1;
        const f = REPULSION * cell.mass / (d2 * Math.sqrt(d2));
        fx -= dx * f; fy -= dy * f;
      } else {
        const k = cell.kids;
        bhStack.push(k[0], k[1], k[2], k[3]);
      }
    }
    n.vx += fx;
    n.vy += fy;
  }

  function simulate() {
    const nodes = NODES;
    const edges = EDGES;
    const movers = movable === null ? nodes : nodes.filter(canMove);
    // Layout forces (repulsion, springs, gravity) are scaled by the cooling
    // temperature below; remember the velocity they start from.
    movers.forEach(n => { n._vx = n.vx; n._vy = n.vy; });

    // Repulsion on the nodes that may move, from every node.
    if (movers.length && nodes.length > 1) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      nodes.forEach(n => {
        if (n.x < minX) minX = n.x; if (n.y < minY) minY = n.y;
        if (n.x > maxX) maxX = n.x; if (n.y > maxY) maxY = n.y;
      });
      const root = bhCell(minX, minY, Math.max(maxX - minX, maxY - minY, 1) + 1);
      nodes.forEach(n => bhInsert(root, n, 0));
      bhMass(root);
      movers.forEach(m => bhRepel(m, root));
    }

    // Springs
    edges.forEach(e => {
      const s = nodeMap.get(e.source);
      const t = nodeMap.get(e.target);
      if (!s || !t) return;
      let dx = t.x - s.x;
      let dy = t.y - s.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const stretch = d - SPRING_REST;
      // Divide by the smaller degree (as d3-force does): a hub with dozens of
      // links would otherwise be yanked by all of them at full strength,
      // overshoot, and swing wider every step until the layout explodes.
      const k = SPRING_K * (e.strength || 1) / Math.max(1, Math.min(s.connections || 1, t.connections || 1));
      const fx = (dx / d) * stretch * k;
      const fy = (dy / d) * stretch * k;
      if (canMove(s)) { s.vx += fx; s.vy += fy; }
      if (canMove(t)) { t.vx -= fx; t.vy -= fy; }
    });

    // Center gravity
    movers.forEach(n => {
      n.vx -= n.x * CENTER_GRAVITY;
      n.vy -= n.y * CENTER_GRAVITY;
    });

    // Cool the layout forces (as d3-force does with alpha). Collision below is
    // NOT cooled, so overlaps keep being resolved to the very end.
    movers.forEach(n => {
      n.vx = n._vx + (n.vx - n._vx) * alpha;
      n.vy = n._vy + (n.vy - n._vy) * alpha;
    });

    // Collision: bubbles closer than their radii (+ padding) push apart, so the
    // settled map has no stacked bubbles. A grid keeps it O(n).
    // Like d3's forceCollide it works on where each bubble is about to be
    // (x + vx), and runs several passes per step so a dense core spreads out.
    if (movers.length) {
      const cell = 2 * MAX_RADIUS + COLLIDE_PAD;
      nodes.forEach(n => { n._r = nodeRadius(n); });
      for (let pass = 0; pass < COLLIDE_PASSES; pass++) {
        const grid = new Map();
        nodes.forEach(n => {
          const key = Math.floor((n.x + n.vx) / cell) * 73856093 ^ Math.floor((n.y + n.vy) / cell) * 19349663;
          const bucket = grid.get(key);
          if (bucket) bucket.push(n); else grid.set(key, [n]);
        });
        movers.forEach(m => {
          const mx = m.x + m.vx, my = m.y + m.vy;
          const gx = Math.floor(mx / cell), gy = Math.floor(my / cell);
          for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
            const bucket = grid.get((gx + i) * 73856093 ^ (gy + j) * 19349663);
            if (!bucket) continue;
            for (let k = 0; k < bucket.length; k++) {
              const o = bucket[k];
              if (o === m) continue;
              let dx = mx - (o.x + o.vx), dy = my - (o.y + o.vy);
              let d = Math.sqrt(dx * dx + dy * dy);
              const min = m._r + o._r + COLLIDE_PAD;
              if (d >= min) continue;
              if (d < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = Math.sqrt(dx * dx + dy * dy); }
              const push = (min - d) / d * COLLIDE_STRENGTH;
              m.vx += dx * push; m.vy += dy * push;
            }
          }
        });
      }
    }

    // Integrate. Fixed nodes never move, and no node jumps more than MAX_STEP
    // in one step (a safety net against any force spike).
    nodes.forEach(n => {
      if (!canMove(n)) { n.vx = 0; n.vy = 0; return; }
      n.vx *= DAMPING;
      n.vy *= DAMPING;
      const speed = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
      if (speed > MAX_STEP) { n.vx *= MAX_STEP / speed; n.vy *= MAX_STEP / speed; }
      n.x += n.vx * DT;
      n.y += n.vy * DT;
    });
  }

  // ===== RENDERING =====
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function worldToScreen(wx, wy) {
    return [(wx - camX) * camZoom + window.innerWidth / 2,
            (wy - camY) * camZoom + window.innerHeight / 2];
  }

  function screenToWorld(sx, sy) {
    return [(sx - window.innerWidth / 2) / camZoom + camX,
            (sy - window.innerHeight / 2) / camZoom + camY];
  }

  function draw() {
    const w = window.innerWidth, h = window.innerHeight;
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // Draw subtle grid
    const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
    ctx.strokeStyle = gridColor;
    ctx.globalAlpha = 0.15;
    ctx.lineWidth = 0.5;
    const gridSize = 60;
    const [ox, oy] = worldToScreen(0, 0);
    const startX = ox % (gridSize * camZoom);
    const startY = oy % (gridSize * camZoom);
    for (let x = startX; x < w; x += gridSize * camZoom) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = startY; y < h; y += gridSize * camZoom) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const visIds = new Set(getVisibleNodes().map(n => n.id));
    const visEdges = EDGES.filter(e => visIds.has(e.source) && visIds.has(e.target));

    const edgeColor = getComputedStyle(document.documentElement).getPropertyValue('--edge-color').trim();
    const edgeHl = getComputedStyle(document.documentElement).getPropertyValue('--edge-highlight').trim();

    // Edges
    visEdges.forEach(e => {
      const s = nodeMap.get(e.source);
      const t = nodeMap.get(e.target);
      if (!s || !t) return;

      const [sx, sy] = worldToScreen(s.x, s.y);
      const [tx, ty] = worldToScreen(t.x, t.y);
      const connected = selectedNodeId && (e.source === selectedNodeId || e.target === selectedNodeId);

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(tx, ty);
      ctx.lineWidth = connected ? (e.strength || 1) * 1.2 : Math.max(0.5, (e.strength || 1) * 0.7);
      ctx.strokeStyle = connected ? edgeHl : edgeColor;
      ctx.globalAlpha = connected ? 0.8 : (searchQuery && (!isHighlighted(s) || !isHighlighted(t)) ? 0.1 : 0.4);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });

    // Nodes
    NODES.forEach(n => {
      if (!visIds.has(n.id)) return;
      const [sx, sy] = worldToScreen(n.x, n.y);
      const r = nodeRadius(n) * camZoom;
      if (sx + r < -20 || sx - r > w + 20 || sy + r < -20 || sy - r > h + 20) return;

      const col = getTypeColor(n.type);
      const hl = isHighlighted(n);
      const selected = n.id === selectedNodeId;
      const hovered = n === hoveredNode;
      const dimmed = searchQuery && !hl;

      // Glow for selected/hovered
      if ((selected || hovered) && !dimmed) {
        const glowAlpha = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--node-glow').trim()) || 0.25;
        ctx.beginPath();
        ctx.arc(sx, sy, r + 6 * camZoom, 0, Math.PI * 2);
        ctx.fillStyle = col;
        ctx.globalAlpha = glowAlpha;
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fillStyle = col;
      // In a public view, confidential bubbles are drawn faint: present, not readable.
      ctx.globalAlpha = dimmed ? 0.12 : (selected ? 1 : (n.confidential ? 0.3 : 0.85));
      ctx.fill();
      ctx.globalAlpha = 1;

      // Border ring for selected
      if (selected) {
        ctx.beginPath();
        ctx.arc(sx, sy, r + 2 * camZoom, 0, Math.PI * 2);
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // Label for larger nodes when zoomed in enough
      if (camZoom > 0.6 && r > 6 * camZoom && !dimmed) {
        const label = n.id.substring(0, 8);
        ctx.font = `${Math.max(9, 10 * camZoom)}px ui-monospace, 'SF Mono', Menlo, monospace`;
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim();
        ctx.globalAlpha = dimmed ? 0.15 : 0.7;
        ctx.textAlign = 'center';
        ctx.fillText(label, sx, sy + r + 12 * camZoom);
        ctx.globalAlpha = 1;
      }
    });
  }

  // ===== HIT TESTING =====
  function hitTest(mx, my, slop = 4) {
    const [wx, wy] = screenToWorld(mx, my);
    const visIds = new Set(getVisibleNodes().map(n => n.id));
    let closest = null, closestDist = Infinity;
    NODES.forEach(n => {
      if (!visIds.has(n.id)) return;
      const dx = n.x - wx, dy = n.y - wy;
      const d = Math.sqrt(dx * dx + dy * dy);
      const r = nodeRadius(n) + slop / camZoom;  // world units; slop is screen pixels
      if (d < r && d < closestDist) { closest = n; closestDist = d; }
    });
    return closest;
  }

  // ===== SIDEBAR =====
  function openSidebar(node) {
    selectedNodeId = node.id;
    const col = getTypeColor(node.type);
    sidebarBadge.textContent = node.type;
    sidebarBadge.style.background = col + '18';
    sidebarBadge.style.color = col;

    const connectedEdges = EDGES.filter(e => e.source === node.id || e.target === node.id);
    const connectedIds = connectedEdges.map(e => e.source === node.id ? e.target : e.source);

    let html = '';
    html += `<div class="detail-section"><div class="detail-label">ID</div><div class="detail-id">${node.id}</div></div>`;
    if (node.confidential) {
      // The server sent no content, topics, projects or sessions for this node.
      html += `<div class="detail-section"><div class="detail-label">Content</div><div class="detail-content">Confidential. This knowledge exists in the graph, but its details are not public.</div></div>`;
    } else {
      html += `<div class="detail-section"><div class="detail-label">Visibility</div><div class="detail-id">${node.public ? 'Public' : 'Confidential'}</div></div>`;
      html += `<div class="detail-section"><div class="detail-label">Content</div><div class="detail-content">${escapeHtml(node.content)}</div></div>`;
    }

    if (node.hits != null) {
      html += `<div class="detail-section"><div class="detail-label">Hits</div><div class="detail-id">${node.hits}</div></div>`;
    }

    if (!node.confidential) {
      html += `<div class="detail-section"><div class="detail-label">Topics</div><div class="tag-list">${node.topics.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div></div>`;
      html += `<div class="detail-section"><div class="detail-label">Projects</div><div class="tag-list">${node.projects.map(p => `<span class="tag">${escapeHtml(p)}</span>`).join('')}</div></div>`;
      html += `<div class="detail-section"><div class="detail-label">Sessions</div><div class="tag-list">${node.sessions.map(s => `<span class="tag">${escapeHtml(s)}</span>`).join('')}</div></div>`;
    }

    if (connectedIds.length > 0) {
      html += `<div class="detail-section"><div class="detail-label">Connections (${connectedIds.length})</div>`;
      connectedIds.forEach(cid => {
        const cn = nodeMap.get(cid);
        if (!cn) return;
        const cc = getTypeColor(cn.type);
        const preview = cn.content.length > 50 ? cn.content.substring(0, 50) + '...' : cn.content;
        html += `<div class="connection-item" data-nav="${cid}"><span class="connection-dot" style="background:${cc}"></span>${cid} <span style="color:var(--text-muted);margin-left:auto;font-size:10px;text-transform:uppercase">${cn.type}</span></div>`;
      });
      html += '</div>';
    }

    sidebarBody.innerHTML = html;
    sidebar.classList.add('open');

    // Connection click navigation
    sidebarBody.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener('click', () => {
        const target = nodeMap.get(el.dataset.nav);
        if (target) {
          camX = target.x;
          camY = target.y;
          openSidebar(target);
        }
      });
    });
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    selectedNodeId = null;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ===== TOOLTIP =====
  function showTooltip(node, mx, my) {
    const col = getTypeColor(node.type);
    tooltip.innerHTML = `${node.id} <span class="tt-type" style="color:${col}">${node.type}</span>` +
      (node.confidential ? ' <span class="tt-type">confidential</span>' : '');
    tooltip.style.left = (mx + 14) + 'px';
    tooltip.style.top = (my - 10) + 'px';
    tooltip.classList.add('visible');
  }

  function hideTooltip() {
    tooltip.classList.remove('visible');
  }

  // ===== EVENTS =====
  canvas.addEventListener('mousedown', e => {
    const node = hitTest(e.clientX, e.clientY);
    if (node) {
      draggedNode = node;
      canvas.classList.add('grabbing');
    } else {
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      camStartX = camX;
      camStartY = camY;
      canvas.classList.add('grabbing');
    }
  });

  canvas.addEventListener('mousemove', e => {
    if (draggedNode) {
      const [wx, wy] = screenToWorld(e.clientX, e.clientY);
      draggedNode.x = wx;
      draggedNode.y = wy;
      draggedNode.vx = 0;
      draggedNode.vy = 0;
    } else if (isDragging) {
      cameraTouched = true;
      const dx = (e.clientX - dragStartX) / camZoom;
      const dy = (e.clientY - dragStartY) / camZoom;
      camX = camStartX - dx;
      camY = camStartY - dy;
    } else {
      const node = hitTest(e.clientX, e.clientY);
      hoveredNode = node;
      canvas.classList.toggle('pointer', !!node);
      if (node) showTooltip(node, e.clientX, e.clientY);
      else hideTooltip();
    }
  });

  canvas.addEventListener('mouseup', e => {
    if (draggedNode) {
      // If barely moved, treat as click
      const [sx, sy] = worldToScreen(draggedNode.x, draggedNode.y);
      if (Math.abs(sx - e.clientX) < 5 && Math.abs(sy - e.clientY) < 5) {
        // This was effectively a click
      }
      openSidebar(draggedNode);
      draggedNode = null;
      saveLayout();   // a dropped bubble stays where it was put
    } else if (isDragging) {
      isDragging = false;
      // If barely moved, treat as click on background to deselect
      if (Math.abs(e.clientX - dragStartX) < 3 && Math.abs(e.clientY - dragStartY) < 3) {
        closeSidebar();
      }
    }
    canvas.classList.remove('grabbing');
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const zoomFactor = e.deltaY > 0 ? 0.92 : 1.08;
    cameraTouched = true;
    const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camZoom * zoomFactor));
    // Zoom toward cursor
    const [wx, wy] = screenToWorld(e.clientX, e.clientY);
    camZoom = newZoom;
    const [sx2, sy2] = worldToScreen(wx, wy);
    camX += (sx2 - e.clientX) / camZoom;
    camY += (sy2 - e.clientY) / camZoom;
  }, { passive: false });

  // Touch: one finger pans, two fingers pinch-zoom around the fingers, a tap
  // opens a bubble (with a finger-sized hit area) or closes the panel. Bubbles
  // are not dragged by touch, so a shaky tap never moves the map.
  const TAP_SLOP = 10;     // px a finger may move and still count as a tap
  const TOUCH_HIT = 16;    // px around a bubble that still hits it
  let touchMoved = false, tapX = 0, tapY = 0, pinchDist = 0, pinchMidX = 0, pinchMidY = 0;

  function startPan(t) {
    isDragging = true;
    dragStartX = t.clientX; dragStartY = t.clientY;
    camStartX = camX; camStartY = camY;
  }
  function pinchState(e) {
    const a = e.touches[0], b = e.touches[1];
    return [Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
            (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2];
  }

  canvas.addEventListener('touchstart', e => {
    filterPanel.classList.remove('open');   // touching the map closes the filters (phones)
    if (e.touches.length === 1) {
      touchMoved = false;
      tapX = e.touches[0].clientX; tapY = e.touches[0].clientY;
      startPan(e.touches[0]);
    } else if (e.touches.length === 2) {
      touchMoved = true;   // a pinch is never a tap
      isDragging = false;
      [pinchDist, pinchMidX, pinchMidY] = pinchState(e);
    }
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && isDragging) {
      const t = e.touches[0];
      if (Math.hypot(t.clientX - tapX, t.clientY - tapY) > TAP_SLOP) touchMoved = cameraTouched = true;
      camX = camStartX - (t.clientX - dragStartX) / camZoom;
      camY = camStartY - (t.clientY - dragStartY) / camZoom;
    } else if (e.touches.length === 2 && pinchDist > 0) {
      const [dist, midX, midY] = pinchState(e);
      // Keep the world point under the fingers' midpoint under it while zooming,
      // and move with the midpoint so two fingers can also pan.
      const [wx, wy] = screenToWorld(pinchMidX, pinchMidY);
      cameraTouched = true;
      camZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camZoom * (dist / pinchDist)));
      camX = wx - (midX - window.innerWidth / 2) / camZoom;
      camY = wy - (midY - window.innerHeight / 2) / camZoom;
      pinchDist = dist; pinchMidX = midX; pinchMidY = midY;
    }
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    if (e.touches.length === 1) {
      // One finger lifted from a pinch: continue as a pan from where it is.
      pinchDist = 0;
      startPan(e.touches[0]);
      return;
    }
    if (e.touches.length > 0) return;
    isDragging = false;
    pinchDist = 0;
    if (touchMoved) return;
    const node = hitTest(tapX, tapY, TOUCH_HIT);
    if (!node) { closeSidebar(); return; }
    openSidebar(node);
    if (window.innerWidth <= 640) {
      // Keep the bubble visible above the bottom sheet.
      camX = node.x;
      camY = node.y + (window.innerHeight * 0.25) / camZoom;
    }
  });

  sidebarClose.addEventListener('click', closeSidebar);

  const filterToggle = document.getElementById('filter-toggle');
  filterToggle.addEventListener('click', () => {
    const open = filterPanel.classList.toggle('open');
    filterToggle.setAttribute('aria-expanded', String(open));
  });

  searchInput.addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    updateStats();
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeSidebar(); searchInput.blur(); searchQuery = ''; searchInput.value = ''; }
    if (e.key === '/' && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); }
    if ((e.key === 'l' || e.key === 'L') && document.activeElement !== searchInput) relayout();
    if ((e.key === 'f' || e.key === 'F') && document.activeElement !== searchInput) fitView();
  });

  // ===== LOOP =====
  // Redraw only while something changes: the layout settling, the user
  // interacting (hover, pan, zoom, drag, filters, search), or new data.
  // A settled, untouched map costs nothing.
  let lastActivity = performance.now();
  function markActive() { lastActivity = performance.now(); }
  ['mousemove', 'mousedown', 'mouseup', 'wheel', 'touchstart', 'touchmove', 'touchend',
   'keydown', 'input', 'change', 'click', 'resize'].forEach(ev =>
    window.addEventListener(ev, markActive, { capture: true, passive: true }));

  // The layout runs in ~30 ms chunks driven by a MessageChannel, not by
  // animation frames: browsers pause requestAnimationFrame in hidden tabs, which
  // left a layout half-done whenever you looked away. Chunks keep the page
  // responsive and finish in seconds whether or not the tab is visible.
  const layoutChannel = new MessageChannel();
  let layoutRunning = false;
  layoutChannel.port1.onmessage = () => {
    const start = performance.now();
    while (alpha >= ALPHA_MIN && performance.now() - start < 30) {
      simulate();
      alpha *= ALPHA_DECAY;
      if (alpha < ALPHA_MIN) settle();
    }
    markActive();
    if (alpha >= ALPHA_MIN) layoutChannel.port2.postMessage(0);
    else layoutRunning = false;
  };
  function kickLayout() {
    if (alpha >= ALPHA_MIN && !layoutRunning) {
      layoutRunning = true;
      layoutChannel.port2.postMessage(0);
    }
  }

  function loop() {
    if (layoutRunning || performance.now() - lastActivity < 600) draw();
    requestAnimationFrame(loop);
  }

  // ===== DYNAMIC DATA LOADING =====
  // No static snapshot. Everything comes live from the Jejak server, and the page
  // polls for changes so new knowledge appears without a manual reload.

  const REFRESH_MS = 10000;
  let lastSignature = null;

  function signature(data) {
    // Cheap change-detector: node/edge counts + per-node id/hits/score.
    let s = data.nodes.length + ':' + data.edges.length + '|';
    for (const n of data.nodes) s += n.id + n.hits + Math.round(n.score || 0) + (n.public ? 'p' : '') + ';';
    return s;
  }

  function applyGraph(data, isFirstLoad) {
    // Preserve positions of nodes that already exist so refreshes don't scramble
    // the layout; only brand-new nodes get a fresh position.
    const prevPos = new Map();
    if (!isFirstLoad) NODES.forEach(n => prevPos.set(n.id, { x: n.x, y: n.y, vx: n.vx, vy: n.vy }));

    NODES = data.nodes;
    EDGES = data.edges || [];
    rebuildIndices();

    // Positions: this page's own (refresh), else the remembered layout, else new.
    const saved = isFirstLoad ? loadLayout() : {};
    const fresh = [];
    NODES.forEach(n => {
      const p = prevPos.get(n.id) || (saved[n.id] && { x: saved[n.id][0], y: saved[n.id][1] });
      n.vx = 0; n.vy = 0;
      if (p) { n.x = p.x; n.y = p.y; }
      else fresh.push(n);
    });
    // What may move: everything on a first-ever layout (or when most of the
    // map is new), only the new bubbles otherwise, nothing if nothing is new.
    // A full layout already running keeps running.
    const fullLayout = fresh.length > NODES.length / 2 || (movable === null && alpha >= ALPHA_MIN);
    const freshIds = new Set(fresh.map(n => n.id));
    const anchorOf = new Map();
    if (!fullLayout) {
      EDGES.forEach(e => {
        if (freshIds.has(e.source) && !freshIds.has(e.target) && !anchorOf.has(e.source)) anchorOf.set(e.source, e.target);
        if (freshIds.has(e.target) && !freshIds.has(e.source) && !anchorOf.has(e.target)) anchorOf.set(e.target, e.source);
      });
    }
    // Unanchored bubbles start on a disc sized to the map, not crammed into a
    // fixed ring: thousands of overlapping starts give huge first-step forces.
    // Radius ~25*sqrt(n) holds every bubble with room to spare, so collision
    // only has to tidy, not un-stack thousands of starts.
    const spread = Math.max(300, 25 * Math.sqrt(NODES.length));
    fresh.forEach(n => {
      // Start a new bubble beside something it links to, so it settles nearby.
      const anchor = nodeMap.get(anchorOf.get(n.id));
      const a = Math.random() * Math.PI * 2;
      const r = anchor ? 20 + Math.random() * 30 : Math.sqrt(Math.random()) * spread;
      n.x = (anchor ? anchor.x : 0) + Math.cos(a) * r;
      n.y = (anchor ? anchor.y : 0) + Math.sin(a) * r;
    });

    if (fullLayout) { movable = null; if (alpha < ALPHA_MIN) alpha = 1; }
    else if (fresh.length) { movable = freshIds; alpha = 0.5; }
    else if (isFirstLoad) settle();

    if (isFirstLoad) {
      visibleTypes = new Set(allTypes);
      if (!cameraTouched) fitView();
    } else {
      // Keep the user's filter choices; just make sure any newly-appeared type
      // is visible by default.
      allTypes.forEach(t => { if (!visibleTypes.has(t) && !knownTypes.has(t)) visibleTypes.add(t); });
    }
    knownTypes = new Set(allTypes);

    buildFilters();
    updateStats();
    // If the currently selected node vanished, close its sidebar.
    if (selectedNodeId && !nodeMap.has(selectedNodeId)) closeSidebar();
    markActive();   // repaint once for the new data even if nobody is touching the page
    kickLayout();   // place new bubbles (no-op when nothing needs to move)
  }

  function showMessage(msg) {
    statsBar.innerHTML = `<span style="opacity:.7">${msg}</span>`;
  }

  let knownTypes = new Set();

  // ===== SERVER, LOGIN AND SPACES =====
  // /s/<space> is a space's public view (no login; confidential entries arrive
  // blank). Everywhere else the page signs in and shows the spaces you belong to.
  const PUBLIC_SLUG = (location.pathname.match(/^\/s\/([a-z0-9-]+)/) || [])[1] || null;
  const TOKEN_KEY = 'jejak-token', SPACE_KEY = 'jejak-space';
  let token = localStorage.getItem(TOKEN_KEY);
  let currentSpace = localStorage.getItem(SPACE_KEY) || '';
  const loginBox = document.getElementById('login');
  const accountBox = document.getElementById('account');

  function esc(t) {
    return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function dataUrl() {
    if (PUBLIC_SLUG) return '/v1/public/' + PUBLIC_SLUG + '/graph';
    return '/v1/graph' + (currentSpace ? '?space=' + encodeURIComponent(currentSpace) : '');
  }

  function api(path, opts = {}) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (token && !PUBLIC_SLUG) headers.Authorization = 'Bearer ' + token;
    return fetch(path, Object.assign({ cache: 'no-store' }, opts, { headers }));
  }

  function showLogin(message) {
    loginBox.hidden = false;
    document.getElementById('login-err').textContent = message || '';
    document.getElementById('login-user').focus();
  }

  document.getElementById('login-form').addEventListener('submit', e => {
    e.preventDefault();
    const body = { username: document.getElementById('login-user').value.trim(),
                   password: document.getElementById('login-pass').value,
                   token_name: 'browser', days: 30 };
    fetch('/v1/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(r => r.json().then(j => ({ ok: r.ok, j })))
      .then(({ ok, j }) => {
        if (!ok) { showLogin(j.error || 'Sign-in failed'); return; }
        token = j.token;
        localStorage.setItem(TOKEN_KEY, token);
        document.getElementById('login-pass').value = '';
        loginBox.hidden = true;
        start();
      })
      .catch(() => showLogin('Cannot reach the server.'));
  });

  function renderAccount(me) {
    const opts = ['<option value="">All my spaces</option>'].concat(me.spaces.map(sp =>
      `<option value="${esc(sp.slug)}"${sp.slug === currentSpace ? ' selected' : ''}>${esc(sp.slug)} (${esc(sp.role)})</option>`));
    accountBox.innerHTML = `<span class="who">${esc(me.username)}</span>
      <select id="space-select" aria-label="Space">${opts.join('')}</select>
      <button id="logout-btn" type="button">Sign out</button>`;
    accountBox.hidden = false;
    document.getElementById('space-select').addEventListener('change', e => {
      currentSpace = e.target.value;
      localStorage.setItem(SPACE_KEY, currentSpace);
      lastSignature = null;
      fetchGraph(true);
    });
    document.getElementById('logout-btn').addEventListener('click', () => {
      api('/v1/auth/logout', { method: 'POST' }).finally(() => {
        localStorage.removeItem(TOKEN_KEY);
        token = null;
        location.reload();
      });
    });
  }

  function fetchGraph(isFirstLoad) {
    return api(dataUrl())
      .then(r => {
        if (r.status === 401 && !PUBLIC_SLUG) {
          localStorage.removeItem(TOKEN_KEY);
          token = null;
          showLogin('Please sign in.');
          throw new Error('signed out');
        }
        if (r.status === 404 && PUBLIC_SLUG) throw new Error('this space has no public view');
        return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status));
      })
      .then(data => {
        if (!data || !Array.isArray(data.nodes)) throw new Error('bad payload');
        const sig = signature(data);
        if (sig === lastSignature) return;      // nothing changed
        lastSignature = sig;
        applyGraph(data, isFirstLoad);
      })
      .catch(err => {
        if (isFirstLoad && err.message !== 'signed out') showMessage('Could not load graph data (' + err.message + ')');
      });
  }

  let started = false;
  function start() {
    if (started) return;
    if (!PUBLIC_SLUG) {
      if (!token) { showLogin(); return; }
      api('/v1/me').then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(me => {
          if (currentSpace && !me.spaces.some(sp => sp.slug === currentSpace)) currentSpace = '';
          renderAccount(me);
        })
        .catch(status => { if (status === 401) { localStorage.removeItem(TOKEN_KEY); token = null; showLogin('Please sign in.'); } });
    }
    started = true;
    fetchGraph(true).finally(() => {
      loop();
      setInterval(() => { if (token || PUBLIC_SLUG) fetchGraph(false); }, REFRESH_MS);
    });
  }

  // ===== INIT =====
  window.addEventListener('resize', resize);
  resize();

  start();
})();
</script>
